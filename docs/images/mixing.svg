<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mixGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <circle cy="100" r="60" fill="#ef4444" fill-opacity="0.8">
    <animate attributeName="cx"
      values="150; 150; 280; 280; 150"
      keyTimes="0; 0.071; 0.5; 0.643; 1"
      calcMode="spline"
      keySplines="0 0 1 1; 0.45 0 0.55 1; 0 0 1 1; 0.45 0 0.55 1"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>
  <circle cy="100" r="60" fill="#3b82f6" fill-opacity="0.8">
    <animate attributeName="cx"
      values="650; 650; 520; 520; 650"
      keyTimes="0; 0.071; 0.5; 0.643; 1"
      calcMode="spline"
      keySplines="0 0 1 1; 0.45 0 0.55 1; 0 0 1 1; 0.45 0 0.55 1"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>
  <rect x="250" y="80" width="300" height="40" rx="20" fill="url(#mixGradient)"/>
  <text x="400" y="150" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#1e293b">Perceptual Mixing</text>
</svg>