<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <!-- Reference wheel: static -->
  <circle cx="200" cy="100" r="70" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <!-- Triadic group: rotates around wheel center -->
  <g>
    <path d="M 200 30 L 260 140 L 140 140 Z" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2" />
    <circle cx="200" cy="30" r="10" fill="#ef4444" />
    <circle cx="260" cy="140" r="10" fill="#22c55e" />
    <circle cx="140" cy="140" r="10" fill="#3b82f6" />
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 100" to="360 200 100"
      dur="12s"
      repeatCount="indefinite"/>
  </g>
  <text x="350" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#64748b">Triadic Harmony</text>
</svg>