<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <path d="M 400 30 C 550 30, 650 80, 650 130 C 650 180, 500 180, 400 180 C 300 180, 150 180, 150 130 C 150 80, 250 30, 400 30" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <!-- R, G, B primaries: cascade reveal -->
  <circle cx="250" cy="130" r="10" fill="#ff0000" fill-opacity="0.5" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0"
      keyTimes="0; 0.1; 0.16; 0.9; 1"
      dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="60" r="10" fill="#00ff00" fill-opacity="0.5" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0"
      keyTimes="0; 0.3; 0.36; 0.9; 1"
      dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="130" r="10" fill="#0000ff" fill-opacity="0.5" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0"
      keyTimes="0; 0.5; 0.56; 0.9; 1"
      dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CIE XYZ</text>
</svg>
