<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <!-- Outer: larger reference gamut, appears first -->
  <path d="M 400 20 L 700 180 L 100 180 Z" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 1; 1; 0; 0"
      keyTimes="0; 0.083; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Inner: Display P3 gamut, appears after -->
  <path d="M 400 50 L 600 160 L 200 160 Z" fill="#ef4444" stroke="#ef4444" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.25; 0.333; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">Wide Gamut</text>
  <text x="450" y="170" font-family="sans-serif" font-size="12" fill="#64748b">sRGB</text>
</svg>