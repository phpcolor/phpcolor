<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <!-- Outer: larger reference, appears first -->
  <path d="M 400 30 L 650 175 L 150 175 Z" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 1; 1; 0; 0"
      keyTimes="0; 0.083; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Inner: Adobe RGB (1998) gamut -->
  <path d="M 400 60 L 580 160 L 220 160 Z" fill="#0891b2" stroke="#0891b2" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.25; 0.333; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0891b2">Adobe RGB (1998)</text>
  <text x="450" y="170" font-family="sans-serif" font-size="12" fill="#64748b">sRGB</text>
</svg>