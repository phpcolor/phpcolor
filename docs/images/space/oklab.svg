<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial hue wheel for the a/b plane -->
    <radialGradient id="oklabWheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>

  <!-- a* axis (green ← → red) -->
  <line x1="170" y1="100" x2="330" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- b* axis (blue ↓ ↑ yellow) -->
  <line x1="250" y1="40" x2="250" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="335" y="104" font-family="sans-serif" font-size="11" fill="#94a3b8">a</text>
  <text x="253" y="36" font-family="sans-serif" font-size="11" fill="#94a3b8">b</text>

  <!-- Perceptual uniformity hint: concentric rings (achromatic center outward = more chroma) -->
  <circle cx="250" cy="100" r="28" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="250" cy="100" r="56" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Center: achromatic point -->
  <circle cx="250" cy="100" r="4" fill="#94a3b8"/>

  <!-- Hue vector arm: rotates, endpoint color cycles through hues -->
  <g>
    <line x1="250" y1="100" x2="306" y2="100" stroke="#64748b" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="306" cy="100" r="9">
      <animate attributeName="fill"
        values="#ef4444; #f59e0b; #22c55e; #06b6d4; #3b82f6; #8b5cf6; #ef4444"
        keyTimes="0; 0.167; 0.333; 0.5; 0.667; 0.833; 1"
        calcMode="linear"
        dur="10s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
      from="0 250 100" to="360 250 100"
      dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- L axis (separate, left side) -->
  <line x1="100" y1="155" x2="100" y2="45" stroke="#64748b" stroke-width="2"/>
  <circle cx="100" cy="45" r="3" fill="#1e293b"/>
  <circle cx="100" cy="155" r="3" fill="#64748b" fill-opacity="0.3"/>
  <text x="90" y="42" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">1.0</text>
  <text x="90" y="158" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">0.0</text>
  <text x="90" y="102" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">L</text>

  <!-- Sliding L indicator -->
  <circle cx="100" r="5" fill="#1e293b" stroke="#fff" stroke-width="1.5">
    <animate attributeName="cy"
      values="45; 155; 45"
      keyTimes="0; 0.5; 1"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="430" y="88" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Oklab</text>
  <text x="430" y="110" font-family="sans-serif" font-size="12" fill="#64748b">Perceptually uniform</text>
</svg>