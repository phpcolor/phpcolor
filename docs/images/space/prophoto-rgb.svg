<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <!-- Outer: extreme reference, appears first -->
  <path d="M 400 5 L 780 195 L 20 195 Z" fill="#9333ea" fill-opacity="0.1" stroke="#9333ea" stroke-width="1" opacity="0">
    <animate attributeName="opacity"
      values="0; 1; 1; 0; 0"
      keyTimes="0; 0.083; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Inner: ProPhoto gamut -->
  <path d="M 400 60 L 580 160 L 220 160 Z" fill="#9333ea" fill-opacity="0.3" stroke="#9333ea" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.25; 0.333; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9333ea">Extreme Gamut (D50)</text>
</svg>