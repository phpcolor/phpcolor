<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>

  <!-- L axis -->
  <line x1="100" y1="150" x2="100" y2="50" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">L*</text>

  <!-- a* axis -->
  <line x1="200" y1="100" x2="400" y2="100" stroke="#64748b" stroke-width="2"/>
  <text x="415" y="105" font-family="sans-serif" font-size="12" fill="#64748b">a*</text>

  <!-- b* axis -->
  <line x1="300" y1="50" x2="300" y2="150" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">b*</text>

  <!-- Dot orbiting the a*/b* plane around (300,100) -->
  <circle r="6" fill="#ef4444" fill-opacity="0.8">
    <animate attributeName="cx"
      values="355; 300; 245; 300; 355"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
      dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy"
      values="100; 60; 100; 140; 100"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
      dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill"
      values="#ef4444; #3b82f6; #22c55e; #f59e0b; #ef4444"
      keyTimes="0; 0.25; 0.5; 0.75; 1"
      dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="550" y="105" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CIELAB (Lab)</text>
</svg>