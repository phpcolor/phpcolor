<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" rx="12" fill="#f8fafc"/>
  <!-- Outermost: ultra-wide reference, appears first -->
  <path d="M 400 10 L 750 190 L 50 190 Z" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1" opacity="0">
    <animate attributeName="opacity"
      values="0; 1; 1; 0; 0"
      keyTimes="0; 0.067; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Middle: Rec.2020 -->
  <path d="M 400 30 L 680 175 L 120 175 Z" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.2; 0.267; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <!-- Inner: sRGB reference, appears last -->
  <path d="M 400 60 L 580 160 L 220 160 Z" fill="#22c55e" stroke="#22c55e" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.4; 0.467; 0.833; 0.917; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#22c55e">Ultra-Wide Gamut</text>
  <text x="450" y="170" font-family="sans-serif" font-size="10" fill="#64748b">sRGB</text>
</svg>