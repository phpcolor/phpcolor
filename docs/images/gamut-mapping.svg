<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowGamut" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="200" rx="12" fill="#f8fafc"/>

  <!-- sRGB gamut triangle (the boundary) -->
  <path d="M 320 30 L 520 170 L 120 170 Z" fill="#e2e8f0" fill-opacity="0.5" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">sRGB gamut</text>

  <!-- Arrow from out-of-gamut to in-gamut point -->
  <!-- Arrow animates: starts invisible, then appears as the out-of-gamut dot appears -->
  <line x1="460" y1="60" x2="406" y2="86"
    stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"
    marker-end="url(#arrowGamut)" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.08; 0.28; 0.38; 0.75; 0.85; 1"
      dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- In-gamut mapped point (on triangle edge) -->
  <circle cx="406" cy="86" r="7" fill="#3b82f6" stroke="#fff" stroke-width="2" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0"
      keyTimes="0; 0.3; 0.4; 0.75; 0.85; 1"
      dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Out-of-gamut dot: vivid Display P3 color, outside triangle -->
  <circle r="9" stroke="#fff" stroke-width="2" opacity="0">
    <!-- Starts inside, slides outside, holds, then maps back -->
    <animate attributeName="cx"
      values="320; 320; 460; 460; 406; 406; 320"
      keyTimes="0; 0.05; 0.25; 0.55; 0.7; 0.85; 1"
      calcMode="spline"
      keySplines="0 0 1 1; 0.45 0 0.55 1; 0 0 1 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0 0 1 1"
      dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy"
      values="100; 100; 60; 60; 86; 86; 100"
      keyTimes="0; 0.05; 0.25; 0.55; 0.7; 0.85; 1"
      calcMode="spline"
      keySplines="0 0 1 1; 0.45 0 0.55 1; 0 0 1 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0 0 1 1"
      dur="7s" repeatCount="indefinite"/>
    <animate attributeName="fill"
      values="#22d3ee; #22d3ee; #22d3ee; #22d3ee; #3b82f6; #3b82f6; #22d3ee"
      keyTimes="0; 0.05; 0.25; 0.55; 0.7; 0.85; 1"
      dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0; 1; 1; 1; 1; 1; 0"
      keyTimes="0; 0.05; 0.25; 0.55; 0.7; 0.85; 1"
      dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r"
      values="9; 9; 9; 9; 7; 7; 9"
      keyTimes="0; 0.05; 0.25; 0.55; 0.7; 0.85; 1"
      dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Out-of-gamut label -->
  <text x="490" y="58" font-family="sans-serif" font-size="11" fill="#94a3b8" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 1; 1; 0; 0; 0"
      keyTimes="0; 0.2; 0.3; 0.55; 0.65; 0.75; 1"
      dur="7s" repeatCount="indefinite"/>
    out of gamut
  </text>

  <!-- Right side: explanation text -->
  <text x="580" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Gamut Mapping</text>
  <text x="580" y="112" font-family="sans-serif" font-size="12" fill="#64748b">out-of-gamut colors</text>
  <text x="580" y="128" font-family="sans-serif" font-size="12" fill="#64748b">clipped to boundary</text>
</svg>